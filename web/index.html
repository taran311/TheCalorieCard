<!DOCTYPE html>
<html lang="en-GB">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track calories like a bank balance: log food, keep streaks and get help from your Calorie Coach.">
  <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1B4B" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Calorie Card">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Calorie Card</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app downloads and starts, then faded out. */
    html, body { margin: 0; height: 100%; }
    body { background: #6366F1; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      transition: opacity 250ms ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .card {
      width: 96px;
      height: 62px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.55);
      position: relative;
      box-shadow: 0 10px 30px rgba(30, 27, 75, 0.25);
    }
    /* The card's stripe and chip, drawn in CSS so nothing else loads. */
    #splash .card::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 12px;
      height: 10px;
      background: rgba(255, 255, 255, 0.45);
    }
    #splash .card::after {
      content: "";
      position: absolute;
      left: 12px; bottom: 10px;
      width: 18px; height: 13px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.85);
    }
    #splash p { margin: 0; font-size: 17px; font-weight: 700; }
    #splash .dots { display: flex; gap: 6px; }
    #splash .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      animation: splash-pulse 1.2s infinite ease-in-out;
    }
    #splash .dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
      #splash .dots span { animation: none; opacity: 0.8; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1E1B4B; }
      #splash { background: linear-gradient(135deg, #312E81 0%, #4C1D95 100%); }
    }
    noscript p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Arial, sans-serif;
      color: #FFFFFF;
      text-align: center;
      padding: 48px 24px;
      margin: 0;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="card" aria-hidden="true"></div>
    <p>Loading your card…</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <noscript>
    <p>The Calorie Card needs JavaScript. Please turn it on in your browser
      settings, then reload this page.</p>
  </noscript>
  <script>
    // Flutter fires this once its first frame is on screen; until then the
    // splash above covers the empty page.
    (function () {
      function hideSplash() {
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 300);
      }
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      // Safety net: never leave the splash covering a working app.
      setTimeout(hideSplash, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
