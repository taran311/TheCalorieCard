name: namer_app
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.3.4+22

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.1
  # Evening "log today's food" reminder.
  firebase_messaging: ^15.1.0
  http: ^1.2.2
  timeago: ^3.6.1
  # Remembers light/dark on this device.
  shared_preferences: ^2.3.2
  # Opens Stripe's payment and subscription pages.
  url_launcher: ^6.3.0
  # Play Store update prompts (Android).
  in_app_update: ^4.2.5
  package_info_plus: ">=8.0.0 <10.0.0"
  # Contactless logging: barcode scanning and meal photos.
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  # Premium in the Android app (Google Play Billing).
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # In-memory Firestore for the balance tests in test/.
  fake_cloud_firestore: ">=3.0.3 <3.2.0"

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # The calorie currency symbol (U+E000) as a one-character font, so it
  # works in any text. Made by brand/build_calorie_symbol_font.py.
  fonts:
    - family: CalorieSymbol
      fonts:
        - asset: assets/fonts/CalorieSymbol-Regular.ttf
          weight: 400
        - asset: assets/fonts/CalorieSymbol-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CalorieSymbol-Bold.ttf
          weight: 800
