name: namer_app
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.1
  # Evening "log today's food" reminder.
  firebase_messaging: ^15.1.0
  http: ^1.2.2
  timeago: ^3.6.1
  # Remembers light/dark on this device.
  shared_preferences: ^2.3.2
  # Opens Stripe's payment and subscription pages.
  url_launcher: ^6.3.0
  # Contactless logging: barcode scanning and meal photos.
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # In-memory Firestore for the balance tests in test/.
  fake_cloud_firestore: ">=3.0.3 <3.2.0"

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
