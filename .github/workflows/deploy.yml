name: Deploy to thecaloriecard.com

on:
  push:
    branches: ["develop", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Site is served from the ROOT of thecaloriecard.com, so base-href must be "/".
      - name: Build web
        run: flutter build web --release --base-href /

      - name: Check the build is configured for the site root
        run: |
          grep -q '<base href="/">' build/web/index.html || { echo "::error::wrong base href"; grep -n '<base' build/web/index.html; exit 1; }
          test -f build/web/CNAME || { echo "::error::web/CNAME missing"; exit 1; }
          test -f build/web/main.dart.js || { echo "::error::main.dart.js missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4