name: Build Android app

# Makes the file to upload to Google Play (an .aab "app bundle"), signed
# with your upload key. Run it from GitHub: Actions → Build Android app →
# Run workflow. When it finishes, download "the-calorie-card-aab" from the
# run's page and upload the .aab inside it in the Play Console.
#
# It needs these repository secrets (Settings → Secrets and variables →
# Actions), made by scripts/make_upload_key.ps1:
#   ANDROID_UPLOAD_KEYSTORE   the upload key file, as base64 text
#   ANDROID_UPLOAD_PASSWORD   its password
#   ANDROID_UPLOAD_ALIAS      the key's name inside the file ("upload")

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Set up the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::The upload key secrets aren't set up. See the top of .github/workflows/android.yml."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$PASSWORD"
            echo "keyPassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > android/key.properties
          # The key's fingerprints (not secret): Firebase needs the SHA-1
          # and SHA-256 for Google sign-in to work in the app.
          keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$PASSWORD" -alias "$ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Build the app bundle
        # Each run gets a higher version code, which Google Play requires
        # for every upload.
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_ID=${{ github.sha }}

      - name: Check it's signed with the upload key
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::app-release.aab missing"; exit 1; }
          if jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::Signed with the debug key, which Google Play won't accept"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: the-calorie-card-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
