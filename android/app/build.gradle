plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// The upload key that signs builds for Google Play. Its details live in
// android/key.properties, which is never committed (see .gitignore): on
// your computer it's made by scripts/make_upload_key.ps1, and the GitHub
// build writes it from the repository's secrets. Without it, release
// builds are signed with the debug key, which Google Play won't accept.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
def hasUploadKey = keyPropertiesFile.exists()
if (hasUploadKey) {
    keyPropertiesFile.withReader("UTF-8") { reader ->
        keyProperties.load(reader)
    }
}

android {
    namespace = "com.thecaloriecard.app"
    // Google Play needs new apps and updates to target Android 16 (API 36).
    compileSdk = Math.max(flutter.compileSdkVersion, 36)
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // The app's permanent id on Google Play and in Firebase. Never
        // change it once the app is published.
        applicationId = "com.thecaloriecard.app"
        minSdkVersion = Math.max(flutter.minSdkVersion, 24)
        targetSdk = Math.max(flutter.targetSdkVersion, 36)
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        if (hasUploadKey) {
            upload {
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
                storeFile = file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasUploadKey ? signingConfigs.upload : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
